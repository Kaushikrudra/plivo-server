<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plivo Softphone</title>
  <script src="https://cdn.plivo.com/sdk/browser/v2/plivo.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2f7;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    .phone,
    .login {
      width: min(100% - 32px, 360px);
      background: #ffffff;
      border: 1px solid #dce3ec;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(31, 42, 68, 0.14);
      padding: 22px;
    }

    .screen-hidden {
      display: none;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .login-form {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: #566276;
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      padding: 0 12px;
      color: #101827;
      font: inherit;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: #3679f5;
      box-shadow: 0 0 0 3px rgba(54, 121, 245, 0.16);
    }

    .login-error {
      display: none;
      padding: 10px 12px;
      border: 1px solid #f4b4af;
      border-radius: 8px;
      background: #fff1f0;
      color: #9b1c14;
      font-size: 13px;
    }

    .login-error.visible {
      display: block;
    }

    .login-button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: #3679f5;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout,
    .history {
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      background: #ffffff;
      color: #364152;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      min-height: 34px;
      padding: 0 10px;
    }

    .history {
      background: #f5f7fa;
    }

    .header-main {
      display: grid;
      gap: 8px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 8px 10px;
      border-radius: 999px;
      background: #f3f6f9;
      color: #566276;
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9aa6b2;
    }

    .status.connecting .dot,
    .status.calling .dot {
      background: #d99a16;
      animation: pulse 1s ease-in-out infinite;
    }

    .status.ready .dot,
    .status.connected .dot {
      background: #1f9d55;
    }

    .status.error .dot {
      background: #d93025;
    }

    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }

    .display {
      width: 100%;
      height: 56px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      padding: 0 14px;
      color: #101827;
      font-size: 24px;
      text-align: center;
      outline: none;
      letter-spacing: 0;
    }

    .display:focus {
      border-color: #3679f5;
      box-shadow: 0 0 0 3px rgba(54, 121, 245, 0.16);
    }

    .mic-banner {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid #f4b4af;
      border-radius: 8px;
      background: #fff1f0;
      color: #9b1c14;
      font-size: 13px;
      line-height: 1.35;
    }

    .mic-banner.visible {
      display: block;
    }

    .timer {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0 10px;
      color: #263349;
      font-size: 24px;
      font-variant-numeric: tabular-nums;
    }

    .timer.hidden {
      visibility: hidden;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .key,
    .action {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }

    .key {
      height: 56px;
      background: #f5f7fa;
      color: #172033;
      font-size: 22px;
      font-weight: 700;
      border: 1px solid #dce3ec;
    }

    .key:hover {
      background: #eaf0f7;
    }

    .key:active,
    .action:active {
      transform: translateY(1px);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action {
      min-height: 48px;
      padding: 0 14px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
    }

    .call {
      background: #1f9d55;
    }

    .call:hover:not(:disabled) {
      background: #198c4a;
    }

    .hangup {
      background: #d93025;
    }

    .hangup:hover:not(:disabled) {
      background: #bb271d;
    }

    .mute {
      grid-column: 1 / -1;
      background: #364152;
    }

    .mute.active {
      background: #f59e0b;
      color: #1c1403;
    }

    .action:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.5);
    }

    .modal.screen-hidden {
      display: none;
    }

    .modal-panel {
      width: min(100%, 760px);
      max-height: min(86vh, 620px);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 22px 55px rgba(15, 23, 42, 0.24);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid #e2e8f0;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .modal-close {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      background: #ffffff;
      color: #364152;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .history-body {
      overflow: auto;
      padding: 0;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .history-table th,
    .history-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #edf2f7;
      text-align: left;
      vertical-align: middle;
    }

    .history-table th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: #566276;
      font-size: 12px;
      text-transform: uppercase;
    }

    .history-table audio {
      width: 180px;
      max-width: 100%;
    }

    .empty-history {
      padding: 22px;
      color: #566276;
      text-align: center;
    }
  </style>
</head>
<body>
  <section class="login" id="loginScreen" aria-label="Agent login">
    <h1>Agent Login</h1>
    <form class="login-form" id="loginForm">
      <div class="field">
        <label for="agentNameInput">Agent Name</label>
        <input id="agentNameInput" type="text" autocomplete="off">
      </div>

      <div class="field">
        <label for="agentIdInput">Agent ID</label>
        <select id="agentIdInput" required>
          <option value="">Select agent</option>
          <option value="zohoagent170932965467135247620">zohoagent170932965467135247620</option>
        </select>
      </div>

      <div class="field">
        <label for="agentPasswordInput">Password</label>
        <input id="agentPasswordInput" type="password" autocomplete="current-password" required>
      </div>

      <div class="login-error" id="loginError">Invalid agent credentials</div>
      <button class="login-button" type="submit">Login</button>
    </form>
  </section>

  <main class="phone screen-hidden" id="softphoneScreen" aria-label="Plivo softphone">
    <div class="top">
      <div class="header-main">
        <h1 id="softphoneTitle">Softphone</h1>
        <div class="status connecting" id="status">
          <span class="dot"></span>
          <span id="statusText">Connecting</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="history" id="historyButton" type="button">History</button>
        <button class="logout" id="logoutButton" type="button">Logout</button>
      </div>
    </div>

    <input
      class="display"
      id="numberInput"
      type="tel"
      inputmode="tel"
      autocomplete="off"
      aria-label="Phone number"
      placeholder="Enter number"
    >

    <div class="mic-banner" id="micBanner">Please allow microphone access to make calls</div>

    <div class="timer hidden" id="timer">00:00</div>

    <section class="keypad" aria-label="Numeric keypad">
      <button class="key" type="button" data-key="1">1</button>
      <button class="key" type="button" data-key="2">2</button>
      <button class="key" type="button" data-key="3">3</button>
      <button class="key" type="button" data-key="4">4</button>
      <button class="key" type="button" data-key="5">5</button>
      <button class="key" type="button" data-key="6">6</button>
      <button class="key" type="button" data-key="7">7</button>
      <button class="key" type="button" data-key="8">8</button>
      <button class="key" type="button" data-key="9">9</button>
      <button class="key" type="button" data-key="*">*</button>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key" type="button" data-key="#">#</button>
    </section>

    <section class="controls" aria-label="Call controls">
      <button class="action call" id="callButton" type="button" disabled>Call</button>
      <button class="action hangup" id="hangupButton" type="button" disabled>Hangup</button>
      <button class="action mute" id="muteButton" type="button" disabled>Mute</button>
    </section>
  </main>

  <section class="modal screen-hidden" id="historyModal" aria-label="Call history" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>Call History</h2>
        <button class="modal-close" id="historyCloseButton" type="button">Close</button>
      </div>
      <div class="history-body" id="historyBody">
        <div class="empty-history">Loading...</div>
      </div>
    </div>
  </section>

  <script>
    const SERVER = 'https://plivo-server.onrender.com';
    const VALID_AGENTS = [
      { name: 'Agent 1', username: 'zohoagent170932965467135247620', password: 'Agent@1234' }
    ];

    let plivoBrowserSdk = null;
    let timerInterval = null;
    let timerSeconds = 0;
    let muted = false;
    let sdkReady = false;
    let callActive = false;
    let loggedInAgent = null;

    const loginScreen = document.getElementById('loginScreen');
    const softphoneScreen = document.getElementById('softphoneScreen');
    const loginForm = document.getElementById('loginForm');
    const agentNameInput = document.getElementById('agentNameInput');
    const agentIdInput = document.getElementById('agentIdInput');
    const agentPasswordInput = document.getElementById('agentPasswordInput');
    const loginError = document.getElementById('loginError');
    const softphoneTitle = document.getElementById('softphoneTitle');
    const historyButton = document.getElementById('historyButton');
    const historyModal = document.getElementById('historyModal');
    const historyCloseButton = document.getElementById('historyCloseButton');
    const historyBody = document.getElementById('historyBody');
    const logoutButton = document.getElementById('logoutButton');
    const numberInput = document.getElementById('numberInput');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const timerEl = document.getElementById('timer');
    const micBanner = document.getElementById('micBanner');
    const callButton = document.getElementById('callButton');
    const hangupButton = document.getElementById('hangupButton');
    const muteButton = document.getElementById('muteButton');

    function setStatus(label, type) {
      statusText.textContent = label;
      statusEl.className = 'status ' + type.toLowerCase();
    }

    function updateButtons() {
      const hasNumber = numberInput.value.trim().length > 0;
      callButton.disabled = !sdkReady || callActive || !hasNumber;
      hangupButton.disabled = !callActive;
      muteButton.disabled = !callActive;
    }

    function showLoginScreen() {
      loginScreen.classList.remove('screen-hidden');
      softphoneScreen.classList.add('screen-hidden');
      loginError.classList.remove('visible');
      agentPasswordInput.value = '';
      agentNameInput.focus();
    }

    function showSoftphoneScreen() {
      loginScreen.classList.add('screen-hidden');
      softphoneScreen.classList.remove('screen-hidden');
      softphoneTitle.textContent = 'Softphone - ' + loggedInAgent.name;
      setStatus('Connecting', 'connecting');
      updateButtons();
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function(character) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[character];
      });
    }

    function formatCallTime(value) {
      if (!value) {
        return '-';
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return '-';
      }

      return date.toLocaleString();
    }

    function renderCallHistory(calls) {
      if (!Array.isArray(calls) || calls.length === 0) {
        historyBody.innerHTML = '<div class="empty-history">No calls found</div>';
        return;
      }

      const rows = calls.slice().reverse().map(function(call) {
        const recording = call.recordingUrl
          ? '<audio controls src="' + escapeHtml(call.recordingUrl) + '"></audio>'
          : '-';

        return '<tr>' +
          '<td>' + escapeHtml(formatCallTime(call.time)) + '</td>' +
          '<td>' + escapeHtml(call.agent || '-') + '</td>' +
          '<td>' + escapeHtml(call.to || '-') + '</td>' +
          '<td>' + escapeHtml(call.duration || '-') + '</td>' +
          '<td>' + recording + '</td>' +
        '</tr>';
      }).join('');

      historyBody.innerHTML =
        '<table class="history-table">' +
          '<thead>' +
            '<tr>' +
              '<th>Time</th>' +
              '<th>Agent</th>' +
              '<th>Number Called</th>' +
              '<th>Duration</th>' +
              '<th>Recording</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>';
    }

    async function openHistory() {
      historyModal.classList.remove('screen-hidden');
      historyBody.innerHTML = '<div class="empty-history">Loading...</div>';

      try {
        const response = await fetch(SERVER + '/calls');
        if (!response.ok) {
          throw new Error('Call history request failed');
        }

        const calls = await response.json();
        renderCallHistory(calls);
      } catch (error) {
        historyBody.innerHTML = '<div class="empty-history">Unable to load call history</div>';
        console.error(error);
      }
    }

    function closeHistory() {
      historyModal.classList.add('screen-hidden');
    }

    function renderTimer() {
      const minutes = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const seconds = String(timerSeconds % 60).padStart(2, '0');
      timerEl.textContent = minutes + ':' + seconds;
    }

    function startTimer() {
      stopTimer();
      timerSeconds = 0;
      renderTimer();
      timerEl.classList.remove('hidden');
      timerInterval = window.setInterval(function() {
        timerSeconds += 1;
        renderTimer();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        window.clearInterval(timerInterval);
        timerInterval = null;
      }
      timerSeconds = 0;
      renderTimer();
      timerEl.classList.add('hidden');
    }

    function resetCallUi() {
      callActive = false;
      muted = false;
      muteButton.classList.remove('active');
      muteButton.textContent = 'Mute';
      stopTimer();
      updateButtons();
    }

    async function requestMicPermission() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(function(track) {
          track.stop();
        });
        micBanner.classList.remove('visible');
        return true;
      } catch (error) {
        micBanner.classList.add('visible');
        setStatus('Microphone access denied. Please allow mic and retry.', 'error');
        console.error('Microphone permission failed:', error);
        return false;
      }
    }

    function bindSdkEvents() {
      if (!plivoBrowserSdk || !plivoBrowserSdk.client || typeof plivoBrowserSdk.client.on !== 'function') {
        throw new Error('Plivo SDK event API unavailable');
      }

      plivoBrowserSdk.client.on('onLogin', function() {
        sdkReady = true;
        setStatus('Ready', 'ready');
        updateButtons();
      });

      plivoBrowserSdk.client.on('onLoginFailed', function(reason) {
        sdkReady = false;
        setStatus('Error', 'error');
        console.error('Plivo login failed:', reason);
        updateButtons();
      });

      plivoBrowserSdk.client.on('onCalling', function() {
        callActive = true;
        setStatus('Calling', 'calling');
        updateButtons();
      });

      plivoBrowserSdk.client.on('onCallAnswered', function() {
        callActive = true;
        setStatus('Connected', 'connected');
        startTimer();
        updateButtons();
      });

      plivoBrowserSdk.client.on('onCallTerminated', function() {
        setStatus(sdkReady ? 'Ready' : 'Connecting', sdkReady ? 'ready' : 'connecting');
        resetCallUi();
      });

      plivoBrowserSdk.client.on('onCallFailed', function(cause) {
        setStatus('Error', 'error');
        console.error('Plivo call failed:', cause);
        resetCallUi();
      });
    }

    async function initPlivo() {
      try {
        setStatus('Connecting', 'connecting');
        const tokenUrl = SERVER + '/token?username=' + encodeURIComponent(loggedInAgent.username);
        const response = await fetch(tokenUrl);
        if (!response.ok) {
          throw new Error('Token request failed');
        }

        const credentials = await response.json();
        if (!credentials.username || !credentials.password) {
          throw new Error('Missing Plivo endpoint credentials');
        }

        plivoBrowserSdk = new window.Plivo({
          debug: 'ALL',
          permOnClick: true,
          enableTracking: true
        });

        bindSdkEvents();

        if (!plivoBrowserSdk.client || typeof plivoBrowserSdk.client.login !== 'function') {
          throw new Error('Plivo SDK login API unavailable');
        }

        plivoBrowserSdk.client.login(credentials.username, credentials.password);
      } catch (error) {
        sdkReady = false;
        setStatus('Error', 'error');
        console.error(error);
        updateButtons();
      }
    }

    function handleLogin(event) {
      event.preventDefault();

      const agentName = agentNameInput.value.trim();
      const username = agentIdInput.value.trim();
      const password = agentPasswordInput.value;
      const agent = VALID_AGENTS.find(function(item) {
        return item.username === username;
      });

      if (!agent || agent.password !== password) {
        loginError.classList.add('visible');
        return;
      }

      loggedInAgent = {
        name: agentName || 'Agent',
        username: agent.username,
        password: agent.password
      };
      loginError.classList.remove('visible');
      showSoftphoneScreen();
      initPlivo();
    }

    function logout() {
      if (callActive) {
        hangup();
      }

      loggedInAgent = null;
      plivoBrowserSdk = null;
      sdkReady = false;
      callActive = false;
      numberInput.value = '';
      micBanner.classList.remove('visible');
      resetCallUi();
      setStatus('Connecting', 'connecting');
      showLoginScreen();
    }

    async function makeCall() {
      const allowed = await requestMicPermission();
      if (!allowed) {
        return;
      }

      const inputNumber = numberInput.value.trim();
      if (!plivoBrowserSdk || !inputNumber) {
        return;
      }

      callActive = true;
      setStatus('Calling', 'calling');
      updateButtons();
      plivoBrowserSdk.client.call(inputNumber);
    }

    function hangup() {
      if (!plivoBrowserSdk || !plivoBrowserSdk.client) {
        return;
      }

      plivoBrowserSdk.client.hangup();
      resetCallUi();
      setStatus(sdkReady ? 'Ready' : 'Connecting', sdkReady ? 'ready' : 'connecting');
    }

    function toggleMute() {
      if (!plivoBrowserSdk || !plivoBrowserSdk.client || !callActive) {
        return;
      }

      muted = !muted;
      muteButton.classList.toggle('active', muted);
      muteButton.textContent = muted ? 'Muted' : 'Mute';

      if (muted && typeof plivoBrowserSdk.client.mute === 'function') {
        plivoBrowserSdk.client.mute();
      } else if (!muted && typeof plivoBrowserSdk.client.unmute === 'function') {
        plivoBrowserSdk.client.unmute();
      }
    }

    document.querySelectorAll('[data-key]').forEach(function(button) {
      button.addEventListener('click', function() {
        numberInput.value += button.dataset.key;
        numberInput.focus();
        updateButtons();
      });
    });

    numberInput.addEventListener('input', updateButtons);
    loginForm.addEventListener('submit', handleLogin);
    historyButton.addEventListener('click', openHistory);
    historyCloseButton.addEventListener('click', closeHistory);
    historyModal.addEventListener('click', function(event) {
      if (event.target === historyModal) {
        closeHistory();
      }
    });
    logoutButton.addEventListener('click', logout);
    callButton.addEventListener('click', makeCall);
    hangupButton.addEventListener('click', hangup);
    muteButton.addEventListener('click', toggleMute);

    window.addEventListener('load', showLoginScreen);
  </script>
</body>
</html>
