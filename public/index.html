<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plivo Call</title>
<script src="https://cdn.plivo.com/sdk/browser/v2/plivo.min.js"></script>

<!-- FIX: Zoho SDK PEHLE load hona chahiye, script tag bottom se head me laya -->
<script src="https://live.zwidgets.com/js-sdk/1.0.5/ZohoEmbeddedAppSDK.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .softphone { background: white; border-radius: 16px; padding: 28px; width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
  .header h2 { color: #1a1a2e; font-size: 18px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: #4a6cf7; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; font-weight: bold; flex-shrink: 0; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .contact-info { background: #f8faff; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .contact-name { font-size: 17px; font-weight: 600; color: #1a1a2e; margin-bottom: 4px; }
  .contact-number { font-size: 15px; color: #4a6cf7; font-weight: 500; margin-bottom: 2px; }
  .contact-email { font-size: 12px; color: #888; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; background: #f9f9f9; color: #666; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
  .status-bar.ready .status-dot { background: #28a745; }
  .status-bar.calling .status-dot { background: #ffc107; animation: pulse 1s infinite; }
  .status-bar.connected .status-dot { background: #28a745; animation: pulse 1s infinite; }
  .status-bar.error .status-dot { background: #dc3545; }
  @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }
  .timer { text-align: center; font-size: 28px; font-weight: 300; color: #1a1a2e; margin-bottom: 16px; display: none; letter-spacing: 2px; }
  .buttons { display: flex; gap: 10px; }
  .btn-call { flex: 1; padding: 14px; background: #28a745; color: white; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
  .btn-call:hover:not(:disabled) { background: #218838; transform: translateY(-1px); }
  .btn-call:disabled { background: #ccc; cursor: not-allowed; transform: none; }
  .btn-hangup { flex: 1; padding: 14px; background: #dc3545; color: white; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600; display: none; }
  .btn-hangup:hover { background: #c82333; }
  .btn-mute { padding: 14px 18px; background: #f0f4ff; color: #4a6cf7; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; display: none; }
  .btn-mute.muted { background: #4a6cf7; color: white; }
  .sdk-status { font-size: 11px; color: #aaa; }
</style>
</head>
<body>
<div class="softphone">
  <div class="header">
    <div class="avatar" id="avatar">?</div>
    <div>
      <h2>Plivo Call</h2>
      <div class="sdk-status" id="sdkStatus">Initializing...</div>
    </div>
  </div>
  <div class="contact-info">
    <div class="contact-name" id="contactName">Loading...</div>
    <div class="contact-number" id="contactNumber">--</div>
    <div class="contact-email" id="contactEmail"></div>
  </div>
  <div class="status-bar" id="statusBar">
    <div class="status-dot"></div>
    <span id="statusText">Connecting to server...</span>
  </div>
  <div class="timer" id="timer">00:00</div>
  <div class="buttons">
    <button class="btn-call" id="btnCall" onclick="makeCall()" disabled>📞 Call</button>
    <button class="btn-mute" id="btnMute" onclick="toggleMute()">🎤</button>
    <button class="btn-hangup" id="btnHangup" onclick="hangup()">📵 Hang Up</button>
  </div>
</div>

<script>
  const SERVER = 'https://plivo-server.onrender.com';
  let plivoBrowserSdk = null;
  let timerInterval = null;
  let seconds = 0;
  let isMuted = false;
  let contactPhone = '';



  function getContactInfo() {
  if (typeof ZOHO === 'undefined' || !ZOHO.embeddedApp) {
    console.warn('ZOHO SDK not available — using test data');
    setContactUI({
      name: 'Test Contact',
      phone: '+917509955205',
      email: 'test@example.com',
      initial: 'T',
      imageUrl: null
    });
    return;
  }

  ZOHO.embeddedApp.on("PageLoad", function(data) {
    ZOHO.CRM.API.getRecord({
      Entity: data.Entity,
      RecordID: data.EntityId
    }).then(function(response) {
      const record = response.data[0];
      const name = record.Full_Name || record.Name || record.Last_Name || 'Unknown';
      const phone = record.Phone || record.Mobile || '';
      const email = record.Email || '';
      setContactUI({
        name,
        phone,
        email,
        initial: name.charAt(0).toUpperCase(),
        imageUrl: null
      });
      if (!phone) setStatus('No phone number found', 'error');
    });
  });

  ZOHO.embeddedApp.init();
}

  function setContactUI({ name, phone, email, initial, imageUrl }) {
    document.getElementById('contactName').textContent = name;
    document.getElementById('contactNumber').textContent = phone || 'No number';
    document.getElementById('contactEmail').textContent = email || '';
    contactPhone = phone;

    const avatarEl = document.getElementById('avatar');
    if (imageUrl) {
      // Zoho contact photo hai toh image show karo
      avatarEl.innerHTML = `<img src="${imageUrl}" alt="${name}" onerror="this.parentElement.textContent='${initial}'">`;
    } else {
      avatarEl.textContent = initial;
    }
  }

  async function initPlivo() {
    try {
      const res = await fetch(`${SERVER}/token`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const options = {
        debug: 'ERROR',
        permOnClick: true,
        enableTracking: false,
        closeProtection: false
      };

      plivoBrowserSdk = new window.Plivo(options);

      plivoBrowserSdk.client.on('onLogin', function() {
        document.getElementById('sdkStatus').textContent = '🟢 Connected';
        setStatus('Ready to call', 'ready');
        document.getElementById('btnCall').disabled = false;
      });

      plivoBrowserSdk.client.on('onLoginFailed', function(cause) {
        document.getElementById('sdkStatus').textContent = '🔴 Login failed';
        setStatus('Login failed: ' + cause, 'error');
      });

      plivoBrowserSdk.client.on('onCalling', function() {
        setStatus('Calling...', 'calling');
      });

      plivoBrowserSdk.client.on('onCallRemoteRinging', function() {
        setStatus('Ringing...', 'calling');
      });

      plivoBrowserSdk.client.on('onCallAnswered', function() {
        setStatus('Connected ✓', 'connected');
        document.getElementById('btnMute').style.display = 'block';
        startTimer();
      });

      plivoBrowserSdk.client.on('onCallTerminated', function() {
        setStatus('Ready to call', 'ready');
        resetUI();
      });

      plivoBrowserSdk.client.on('onCallFailed', function(cause) {
        setStatus('Call failed: ' + cause, 'error');
        resetUI();
      });

      plivoBrowserSdk.client.on('onWebrtcNotSupported', function() {
        setStatus('WebRTC not supported in this browser', 'error');
      });

      plivoBrowserSdk.client.login(data.username, data.password);

    } catch(err) {
      document.getElementById('sdkStatus').textContent = '🔴 Error';
      setStatus('Error: ' + err.message, 'error');
    }
  }

  function makeCall() {
    if (!plivoBrowserSdk || !contactPhone) return;
    let number = contactPhone.replace(/\D/g, '');
    if (number.length === 10) number = '91' + number;
    document.getElementById('btnCall').style.display = 'none';
    document.getElementById('btnHangup').style.display = 'block';
    plivoBrowserSdk.client.call(number, {});
  }

  function hangup() {
    if (plivoBrowserSdk) plivoBrowserSdk.client.hangup();
    resetUI();
    setStatus('Ready to call', 'ready');
  }

  function toggleMute() {
    isMuted = !isMuted;
    if (isMuted) {
      plivoBrowserSdk.client.mute();
      document.getElementById('btnMute').textContent = '🔇';
      document.getElementById('btnMute').classList.add('muted');
    } else {
      plivoBrowserSdk.client.unmute();
      document.getElementById('btnMute').textContent = '🎤';
      document.getElementById('btnMute').classList.remove('muted');
    }
  }

  function setStatus(msg, type='') {
    document.getElementById('statusText').textContent = msg;
    document.getElementById('statusBar').className = 'status-bar ' + type;
  }

  function startTimer() {
    seconds = 0;
    document.getElementById('timer').style.display = 'block';
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      document.getElementById('timer').textContent = m + ':' + s;
    }, 1000);
  }

  function resetUI() {
    document.getElementById('btnCall').style.display = 'block';
    document.getElementById('btnCall').disabled = false;
    document.getElementById('btnHangup').style.display = 'none';
    document.getElementById('btnMute').style.display = 'none';
    document.getElementById('timer').style.display = 'none';
    clearInterval(timerInterval);
    isMuted = false;
  }

  // DOMContentLoaded ke baad run karo — Zoho SDK load guaranteed
  document.addEventListener('DOMContentLoaded', function() {
    getContactInfo();
    initPlivo();
  });
</script>
</body>
</html>
