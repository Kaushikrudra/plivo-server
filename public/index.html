<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plivo Softphone</title>
  <script src="https://cdn.plivo.com/sdk/browser/v2/plivo.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2f7;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    .phone {
      width: min(100% - 32px, 360px);
      background: #ffffff;
      border: 1px solid #dce3ec;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(31, 42, 68, 0.14);
      padding: 22px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 8px 10px;
      border-radius: 999px;
      background: #f3f6f9;
      color: #566276;
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9aa6b2;
    }

    .status.connecting .dot,
    .status.calling .dot {
      background: #d99a16;
      animation: pulse 1s ease-in-out infinite;
    }

    .status.ready .dot,
    .status.connected .dot {
      background: #1f9d55;
    }

    .status.error .dot {
      background: #d93025;
    }

    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }

    .display {
      width: 100%;
      height: 56px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      padding: 0 14px;
      color: #101827;
      font-size: 24px;
      text-align: center;
      outline: none;
      letter-spacing: 0;
    }

    .display:focus {
      border-color: #3679f5;
      box-shadow: 0 0 0 3px rgba(54, 121, 245, 0.16);
    }

    .mic-banner {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid #f4b4af;
      border-radius: 8px;
      background: #fff1f0;
      color: #9b1c14;
      font-size: 13px;
      line-height: 1.35;
    }

    .mic-banner.visible {
      display: block;
    }

    .timer {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0 10px;
      color: #263349;
      font-size: 24px;
      font-variant-numeric: tabular-nums;
    }

    .timer.hidden {
      visibility: hidden;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .key,
    .action {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }

    .key {
      height: 56px;
      background: #f5f7fa;
      color: #172033;
      font-size: 22px;
      font-weight: 700;
      border: 1px solid #dce3ec;
    }

    .key:hover {
      background: #eaf0f7;
    }

    .key:active,
    .action:active {
      transform: translateY(1px);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action {
      min-height: 48px;
      padding: 0 14px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
    }

    .call {
      background: #1f9d55;
    }

    .call:hover:not(:disabled) {
      background: #198c4a;
    }

    .hangup {
      background: #d93025;
    }

    .hangup:hover:not(:disabled) {
      background: #bb271d;
    }

    .mute {
      grid-column: 1 / -1;
      background: #364152;
    }

    .mute.active {
      background: #f59e0b;
      color: #1c1403;
    }

    .action:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Plivo softphone">
    <div class="top">
      <h1>Softphone</h1>
      <div class="status connecting" id="status">
        <span class="dot"></span>
        <span id="statusText">Connecting</span>
      </div>
    </div>

    <input
      class="display"
      id="numberInput"
      type="tel"
      inputmode="tel"
      autocomplete="off"
      aria-label="Phone number"
      placeholder="Enter number"
    >

    <div class="mic-banner" id="micBanner">Please allow microphone access to make calls</div>

    <div class="timer hidden" id="timer">00:00</div>

    <section class="keypad" aria-label="Numeric keypad">
      <button class="key" type="button" data-key="1">1</button>
      <button class="key" type="button" data-key="2">2</button>
      <button class="key" type="button" data-key="3">3</button>
      <button class="key" type="button" data-key="4">4</button>
      <button class="key" type="button" data-key="5">5</button>
      <button class="key" type="button" data-key="6">6</button>
      <button class="key" type="button" data-key="7">7</button>
      <button class="key" type="button" data-key="8">8</button>
      <button class="key" type="button" data-key="9">9</button>
      <button class="key" type="button" data-key="*">*</button>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key" type="button" data-key="#">#</button>
    </section>

    <section class="controls" aria-label="Call controls">
      <button class="action call" id="callButton" type="button" disabled>Call</button>
      <button class="action hangup" id="hangupButton" type="button" disabled>Hangup</button>
      <button class="action mute" id="muteButton" type="button" disabled>Mute</button>
    </section>
  </main>

  <script>
    const SERVER = 'https://plivo-server.onrender.com';

    let plivoBrowserSdk = null;
    let timerInterval = null;
    let timerSeconds = 0;
    let muted = false;
    let sdkReady = false;
    let callActive = false;

    const numberInput = document.getElementById('numberInput');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const timerEl = document.getElementById('timer');
    const micBanner = document.getElementById('micBanner');
    const callButton = document.getElementById('callButton');
    const hangupButton = document.getElementById('hangupButton');
    const muteButton = document.getElementById('muteButton');

    function setStatus(label, type) {
      statusText.textContent = label;
      statusEl.className = 'status ' + type.toLowerCase();
    }

    function updateButtons() {
      const hasNumber = numberInput.value.trim().length > 0;
      callButton.disabled = !sdkReady || callActive || !hasNumber;
      hangupButton.disabled = !callActive;
      muteButton.disabled = !callActive;
    }

    function renderTimer() {
      const minutes = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const seconds = String(timerSeconds % 60).padStart(2, '0');
      timerEl.textContent = minutes + ':' + seconds;
    }

    function startTimer() {
      stopTimer();
      timerSeconds = 0;
      renderTimer();
      timerEl.classList.remove('hidden');
      timerInterval = window.setInterval(function() {
        timerSeconds += 1;
        renderTimer();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        window.clearInterval(timerInterval);
        timerInterval = null;
      }
      timerSeconds = 0;
      renderTimer();
      timerEl.classList.add('hidden');
    }

    function resetCallUi() {
      callActive = false;
      muted = false;
      muteButton.classList.remove('active');
      muteButton.textContent = 'Mute';
      stopTimer();
      updateButtons();
    }

    async function requestMicPermission() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(function(track) {
          track.stop();
        });
        micBanner.classList.remove('visible');
        return true;
      } catch (error) {
        micBanner.classList.add('visible');
        setStatus('Microphone access denied. Please allow mic and retry.', 'error');
        console.error('Microphone permission failed:', error);
        return false;
      }
    }

    function bindSdkEvents() {
      if (!plivoBrowserSdk || !plivoBrowserSdk.client || typeof plivoBrowserSdk.client.on !== 'function') {
        throw new Error('Plivo SDK event API unavailable');
      }

      plivoBrowserSdk.client.on('onLogin', function() {
        sdkReady = true;
        setStatus('Ready', 'ready');
        updateButtons();
      });

      plivoBrowserSdk.client.on('onLoginFailed', function(reason) {
        sdkReady = false;
        setStatus('Error', 'error');
        console.error('Plivo login failed:', reason);
        updateButtons();
      });

      plivoBrowserSdk.client.on('onCalling', function() {
        callActive = true;
        setStatus('Calling', 'calling');
        updateButtons();
      });

      plivoBrowserSdk.client.on('onCallAnswered', function() {
        callActive = true;
        setStatus('Connected', 'connected');
        startTimer();
        updateButtons();
      });

      plivoBrowserSdk.client.on('onCallTerminated', function() {
        setStatus(sdkReady ? 'Ready' : 'Connecting', sdkReady ? 'ready' : 'connecting');
        resetCallUi();
      });

      plivoBrowserSdk.client.on('onCallFailed', function(cause) {
        setStatus('Error', 'error');
        console.error('Plivo call failed:', cause);
        resetCallUi();
      });
    }

    async function initPlivo() {
      try {
        setStatus('Connecting', 'connecting');
        const response = await fetch(SERVER + '/token');
        if (!response.ok) {
          throw new Error('Token request failed');
        }

        const credentials = await response.json();
        if (!credentials.username || !credentials.password) {
          throw new Error('Missing Plivo endpoint credentials');
        }

        plivoBrowserSdk = new window.Plivo({
          debug: 'ALL',
          permOnClick: true,
          enableTracking: true
        });

        bindSdkEvents();

        if (!plivoBrowserSdk.client || typeof plivoBrowserSdk.client.login !== 'function') {
          throw new Error('Plivo SDK login API unavailable');
        }

        plivoBrowserSdk.client.login(credentials.username, credentials.password);
      } catch (error) {
        sdkReady = false;
        setStatus('Error', 'error');
        console.error(error);
        updateButtons();
      }
    }

    async function makeCall() {
      const allowed = await requestMicPermission();
      if (!allowed) {
        return;
      }

      const inputNumber = numberInput.value.trim();
      if (!plivoBrowserSdk || !inputNumber) {
        return;
      }

      callActive = true;
      setStatus('Calling', 'calling');
      updateButtons();
      plivoBrowserSdk.client.call(inputNumber);
    }

    function hangup() {
      if (!plivoBrowserSdk || !plivoBrowserSdk.client) {
        return;
      }

      plivoBrowserSdk.client.hangup();
      resetCallUi();
      setStatus(sdkReady ? 'Ready' : 'Connecting', sdkReady ? 'ready' : 'connecting');
    }

    function toggleMute() {
      if (!plivoBrowserSdk || !plivoBrowserSdk.client || !callActive) {
        return;
      }

      muted = !muted;
      muteButton.classList.toggle('active', muted);
      muteButton.textContent = muted ? 'Muted' : 'Mute';

      if (muted && typeof plivoBrowserSdk.client.mute === 'function') {
        plivoBrowserSdk.client.mute();
      } else if (!muted && typeof plivoBrowserSdk.client.unmute === 'function') {
        plivoBrowserSdk.client.unmute();
      }
    }

    document.querySelectorAll('[data-key]').forEach(function(button) {
      button.addEventListener('click', function() {
        numberInput.value += button.dataset.key;
        numberInput.focus();
        updateButtons();
      });
    });

    numberInput.addEventListener('input', updateButtons);
    callButton.addEventListener('click', makeCall);
    hangupButton.addEventListener('click', hangup);
    muteButton.addEventListener('click', toggleMute);

    window.addEventListener('load', initPlivo);
  </script>
</body>
</html>
